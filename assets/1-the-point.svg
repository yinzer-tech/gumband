<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="{{darker_background}}"/>
			<stop offset="0.6" stop-color="{{background}}"/>
			<stop offset="0.74" stop-color="{{lighter_background}}"/>
			<stop offset="1" stop-color="{{darker_background}}"/>
		</linearGradient>
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="9"/>
		</filter>
		<filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
			<feGaussianBlur stdDeviation="3"/>
		</filter>
		<g id="bridge" fill="none" stroke="{{muted}}" stroke-linecap="round" stroke-linejoin="round">
