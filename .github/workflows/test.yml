name: Test

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a change in upstream Omarchy shows up before users hit it.
    - cron: "0 13 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck

      - name: Shellcheck
        run: shellcheck -x bin/gumband install.sh defaults/yinzer-apps.sh script/render-assets

      - name: Tests against the fixture
        run: bats test/

      - name: Fetch upstream Omarchy
        run: git clone --depth 1 https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"

      - name: Upstream still has every command Gumband calls
        run: |
          missing=0
          for command in $(sed -nE 's/^OMARCHY_COMMANDS=\((.*)\)/\1/p' bin/gumband) omarchy-hook; do
            [[ -x $RUNNER_TEMP/omarchy/bin/$command ]] || { echo "::error::upstream dropped $command"; missing=1; }
          done
          grep -q 'hooks/\$1' "$RUNNER_TEMP/omarchy/bin/omarchy-hook" || { echo "::error::omarchy-hook no longer reads ~/.config/omarchy/hooks"; missing=1; }
          grep -q 'omarchy-hook post-update' "$RUNNER_TEMP/omarchy/bin/omarchy-update" || { echo "::error::omarchy-update no longer runs the post-update hook"; missing=1; }
          exit $missing

      - name: Tests against upstream themes
        run: OMARCHY_FIXTURE="$RUNNER_TEMP/omarchy" bats test/
